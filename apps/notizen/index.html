<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Notizen</title>
  <link rel="stylesheet" href="../../shared/shell.css">
  <style>
    :root { --accent: #D69E00; }
    @media (prefers-color-scheme: dark) { :root { --accent: #FFD60A; } .fab { color: #000; } }
    .note-title { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note-row { flex-direction: column; align-items: stretch; gap: 0; }
    .fab { position: fixed; right: calc(var(--safe-right) + 18px); bottom: calc(var(--safe-bottom) + 18px); width: 56px; height: 56px; min-height: 56px; font-size: 28px; box-shadow: 0 8px 20px -6px rgba(0,0,0,.35); }
    #editor {
      display: block; width: 100%; min-height: 60dvh;
      border: 0; outline: none; resize: none; background: transparent;
      font-size: 17px; line-height: 1.45; padding: 4px 0 40px;
    }
    .meta { font-size: 13px; color: var(--text-2); text-align: center; margin: 4px 0 10px; }
    #view-edit .navbar { background: color-mix(in srgb, var(--bg) 82%, transparent); }
    body.editing { background: var(--surface); }
    body.editing .navbar { background: color-mix(in srgb, var(--surface) 82%, transparent); }
  </style>
</head>
<body>
  <!-- Liste -->
  <section id="view-list">
    <nav class="navbar">
      <a class="nav-btn nav-back" href="../../" data-shell-home>Apps</a>
      <span class="navbar-title">Notizen</span>
      <span></span>
    </nav>
    <main class="page">
      <h1 class="large-title">Notizen</h1>
      <input class="input" id="search" type="search" placeholder="Suchen" autocomplete="off">
      <p class="section-title" id="count"></p>
      <div class="group" id="list"></div>
      <div class="empty" id="empty" hidden><div class="empty-icon">📝</div>Keine Notizen.</div>
    </main>
    <button class="btn round fab" id="new" type="button" aria-label="Neue Notiz">＋</button>
  </section>

  <!-- Editor -->
  <section id="view-edit" hidden>
    <nav class="navbar">
      <button class="nav-btn nav-back" id="back" type="button">Notizen</button>
      <span></span>
      <span>
        <button class="nav-btn" id="delete" type="button" style="color: var(--danger)">Löschen</button>
        <button class="nav-btn bold" id="done" type="button">Fertig</button>
      </span>
    </nav>
    <main class="page">
      <div class="meta" id="meta"></div>
      <textarea id="editor" placeholder="Notiz schreiben …"></textarea>
    </main>
  </section>

  <script src="../../shared/shell.js" data-home="none"></script>
  <script>
    const db = Shell.store('notizen');
    let notes = db.get('notes', []);
    let current = null;
    let saveTimer;

    const $ = (id) => document.getElementById(id);
    const viewList = $('view-list'), viewEdit = $('view-edit');
    const editor = $('editor');

    const save = () => db.set('notes', notes);
    const titleOf = (n) => (n.text.trim().split('\n')[0] || 'Neue Notiz').slice(0, 80);
    const previewOf = (n) => n.text.trim().split('\n').slice(1).join(' ').trim() || 'Kein weiterer Text';
    const fmt = (t) => new Date(t).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });

    function transition(fn) {
      document.startViewTransition ? document.startViewTransition(fn) : fn();
    }

    function renderList() {
      const q = $('search').value.trim().toLowerCase();
      const shown = notes
        .filter((n) => !q || n.text.toLowerCase().includes(q))
        .sort((a, b) => b.updated - a.updated);

      $('count').textContent = shown.length === 1 ? '1 Notiz' : shown.length + ' Notizen';
      $('list').hidden = shown.length === 0;
      $('empty').hidden = shown.length !== 0;
      $('list').innerHTML = '';

      shown.forEach((n) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'row note-row';
        row.innerHTML = '<span class="note-title"></span><span class="row-sub"></span>';
        row.querySelector('.note-title').textContent = titleOf(n);
        row.querySelector('.row-sub').textContent =
          new Date(n.updated).toLocaleDateString('de-DE') + '  ' + previewOf(n);
        row.addEventListener('click', () => open(n));
        $('list').appendChild(row);
      });
    }

    function autosize() {
      editor.style.height = 'auto';
      editor.style.height = editor.scrollHeight + 'px';
    }

    function open(note, focus) {
      current = note;
      const show = () => {
        viewList.hidden = true;
        viewEdit.hidden = false;
        document.body.classList.add('editing');
        editor.value = note.text;
        $('meta').textContent = fmt(note.updated);
        autosize();
        window.scrollTo(0, 0);
      };
      if (focus) {
        // iOS zeigt die Tastatur nur, wenn focus() direkt im Tipp-Ereignis passiert → ohne Animation
        show();
        editor.focus();
      } else {
        transition(show);
      }
    }

    function close() {
      clearTimeout(saveTimer);
      flush();
      // Leere Notizen nicht behalten
      if (current && !current.text.trim()) { notes = notes.filter((n) => n !== current); save(); }
      current = null;
      editor.blur();
      transition(() => {
        viewEdit.hidden = true;
        viewList.hidden = false;
        document.body.classList.remove('editing');
        renderList();
      });
    }

    function flush() {
      if (!current || current.text === editor.value) return;
      current.text = editor.value;
      current.updated = Date.now();
      save();
    }

    editor.addEventListener('input', () => {
      autosize();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 300);
    });

    $('new').addEventListener('click', () => {
      const note = { id: Date.now(), text: '', updated: Date.now() };
      notes.push(note);
      open(note, true);
    });
    $('back').addEventListener('click', close);
    $('done').addEventListener('click', () => { flush(); editor.blur(); Shell.toast('Gespeichert'); });
    $('delete').addEventListener('click', () => {
      if (!confirm('Notiz löschen?')) return;
      notes = notes.filter((n) => n !== current);
      save();
      current = null;
      close();
    });
    $('search').addEventListener('input', renderList);

    // Beim Wegwischen der App noch schnell speichern
    document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

    renderList();
  </script>
</body>
</html>
