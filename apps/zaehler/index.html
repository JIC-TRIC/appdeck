<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Zähler</title>
  <link rel="stylesheet" href="../../shared/shell.css">
  <style>
    .counter { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; }
    .counter-name { flex: 1; min-width: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .counter-value {
      min-width: 56px; text-align: right;
      font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .counter-value.bump { animation: bump 0.22s ease; }
    @keyframes bump { 50% { transform: scale(1.18); } }
    .delete { color: var(--danger); display: none; }
    .editing .delete { display: inline-flex; }
    .editing .step { display: none; }
    .add { margin-top: 20px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="nav-btn nav-back" href="../../" data-shell-home>Apps</a>
    <span class="navbar-title">Zähler</span>
    <button class="nav-btn" id="edit" type="button">Bearbeiten</button>
  </nav>

  <main class="page">
    <h1 class="large-title">Zähler</h1>
    <div class="group" id="list"></div>
    <div class="empty" id="empty" hidden><div class="empty-icon">🔢</div>Noch keine Zähler.</div>
    <button class="btn tinted block add" id="add" type="button">＋ Neuer Zähler</button>
    <p class="footnote">Namen antippen zum Umbenennen.</p>
  </main>

  <script src="../../shared/shell.js" data-home="none"></script>
  <script>
    const db = Shell.store('zaehler');
    let counters = db.get('counters', [{ id: Date.now(), name: 'Gläser Wasser', value: 0 }]);
    let editing = false;

    const list = document.getElementById('list');
    const empty = document.getElementById('empty');

    function save() { db.set('counters', counters); }

    function render() {
      list.innerHTML = '';
      list.hidden = counters.length === 0;
      empty.hidden = counters.length !== 0;
      list.classList.toggle('editing', editing);

      counters.forEach((c) => {
        const row = document.createElement('div');
        row.className = 'row counter';
        row.innerHTML = `
          <button class="nav-btn delete" type="button" aria-label="Löschen">Löschen</button>
          <span class="counter-name"></span>
          <span class="counter-value">${c.value}</span>
          <button class="btn round gray step" data-step="-1" type="button" aria-label="Minus">−</button>
          <button class="btn round step" data-step="1" type="button" aria-label="Plus">+</button>`;
        row.querySelector('.counter-name').textContent = c.name;

        row.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
          c.value = Math.max(0, c.value + Number(b.dataset.step));
          save();
          const v = row.querySelector('.counter-value');
          v.textContent = c.value;
          v.classList.remove('bump'); void v.offsetWidth; v.classList.add('bump');
        }));

        row.querySelector('.counter-name').addEventListener('click', () => {
          const name = prompt('Neuer Name:', c.name);
          if (name && name.trim()) { c.name = name.trim(); save(); render(); }
        });

        row.querySelector('.delete').addEventListener('click', () => {
          if (!confirm(`„${c.name}“ löschen?`)) return;
          counters = counters.filter((x) => x.id !== c.id);
          save(); render();
        });

        list.appendChild(row);
      });
    }

    document.getElementById('add').addEventListener('click', () => {
      const name = prompt('Wie soll der Zähler heißen?');
      if (!name || !name.trim()) return;
      counters.push({ id: Date.now(), name: name.trim(), value: 0 });
      save(); render();
    });

    document.getElementById('edit').addEventListener('click', (e) => {
      editing = !editing;
      e.currentTarget.textContent = editing ? 'Fertig' : 'Bearbeiten';
      e.currentTarget.classList.toggle('bold', editing);
      render();
    });

    render();
  </script>
</body>
</html>
