# Baut das Repo bei jedem Push auf main und veröffentlicht dist/ auf GitHub Pages.
# Voraussetzung (einmalig): Settings → Pages → Source: „GitHub Actions“.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # manuell starten: Actions → Deploy to GitHub Pages → Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; ein neuerer Push bricht einen laufenden nicht ab
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build     # TypeScript prüfen + bauen → dist/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
